[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ship-strava"
version = "0.1.0"
description = "Strava for builders: track what you ship every week"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ship-strava = "ship_strava.__main__:main"

[tool.setuptools]
packages = ["ship_strava"]
